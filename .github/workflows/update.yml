name: Update bats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to bundle (default: latest release)"
        type: string
        default: ""
      rebuild:
        description: Publish a packaging rebuild of the current pin
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-bats
  cancel-in-progress: false

env:
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # Index to publish to and to check for existing versions;
  # test.pypi.org to rehearse the pipeline.
  PYPI_HOST: pypi.org

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=()
          [ -n "$TAG" ] && args+=(--tag "$TAG")
          [ "$REBUILD" = "true" ] && args+=(--rebuild)
          uv run scripts/check_upstream.py "${args[@]}"

  bump:
    needs: detect
    if: needs.detect.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      branch: bump/${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - id: bump
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=("$TAG")
          [ "$REBUILD" = "true" ] && args+=(--rebuild)
          uv run scripts/bump.py "${args[@]}"
      - name: Push bump branch
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git switch -c "bump/$VERSION"
          git add pyproject.toml
          git diff --cached --quiet || git commit -m "Bump bats to $TAG"
          git push -u origin "bump/$VERSION"

  test:
    needs: [detect, bump]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}

  publish:
    needs: [detect, bump, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.bump.outputs.version }}
      BRANCH: ${{ needs.bump.outputs.branch }}
      BASE: ${{ github.ref_name }}
    steps:
      # The deploy key is a ruleset bypass actor; pushes to the base branch
      # and the v* tag go over SSH with it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      # Every step from here on is idempotent, so a failed run can simply be
      # retried: the bump branch is dropped as soon as the base branch has the commit,
      # and the tag, PyPI upload and release all tolerate already existing.
      - name: Fast-forward the base branch
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git fetch origin "$BRANCH"
          git merge --ff-only "origin/$BRANCH"
          git push origin "$BASE"
          git push origin --delete "$BRANCH"
      - name: Tag
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://${{ env.PYPI_HOST }}/legacy/
          skip-existing: true
      - name: GitHub release
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" \
            --generate-notes \
            --notes "Bundles upstream https://github.com/bats-core/bats-core/releases/tag/$TAG"

  report-failure:
    needs: [detect, bump, test, publish]
    if: >-
      always() && needs.bump.result == 'success'
      && (needs.test.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.bump.outputs.version }}
      BRANCH: ${{ needs.bump.outputs.branch }}
      BASE: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Open a PR for a red bump, or an issue for a failed publish
        run: |
          if [ "$TEST_RESULT" = "failure" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Bump bats to $TAG (smoke tests failing)" \
              --body "Automated bump failed CI: $RUN_URL"
          else
            title="Release v$VERSION failed after merging to $BASE"
            if [ "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)" = "0" ]; then
              gh issue create --title "$title" \
                --body "The publish job failed: $RUN_URL. Re-run the Update bats workflow; every publish step is idempotent."
            fi
          fi
