name: Update bats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to bundle (default: latest release)"
        type: string
        default: ""
      rebuild:
        description: Publish a packaging rebuild of the current pin
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-bats
  cancel-in-progress: false

env:
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # Minimum age of an upstream release before the schedule bumps to it; a
  # dispatch that names a tag bypasses it.
  COOLDOWN_DAYS: "3"

# The detect and bump jobs run the scripts with `uv run --no-project`, so no
# dev dependency is ever imported in a job that holds a write token.
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=(--cooldown-days "$COOLDOWN_DAYS")
          [ -n "$TAG" ] && args+=(--tag "$TAG")
          [ "$REBUILD" = "true" ] && args+=(--rebuild)
          uv run --no-project --python 3.14 scripts/check_upstream.py "${args[@]}"

  bump:
    needs: detect
    if: needs.detect.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      branch: bump/${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=("$TAG")
          [ "$REBUILD" = "true" ] && args+=(--rebuild)
          uv run --no-project --python 3.14 scripts/bump.py "${args[@]}"
      - id: push
        name: Push bump branch
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git switch -c "bump/$VERSION"
          git add pyproject.toml
          git diff --cached --quiet || git commit -m "Bump bats to $TAG"
          git push -u origin "bump/$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # CI builds and tests the exact commit the bump job created; publish later
  # refuses anything else, so a push to bump/* mid-run cannot be released.
  test:
    needs: [detect, bump]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  publish:
    needs: [detect, bump, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.bump.outputs.version }}
      BRANCH: ${{ needs.bump.outputs.branch }}
      SHA: ${{ needs.bump.outputs.sha }}
      BASE: ${{ github.ref_name }}
    steps:
      # The deploy key is a ruleset bypass actor; pushes to the base branch
      # and the v* tag go over SSH with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      # Retry contract: once the base branch carries the tested commit this
      # step is a no-op and every later step tolerates already existing, so
      # "Re-run failed jobs" finishes the release with the artifact CI tested.
      # A fresh dispatch is no substitute: it builds whatever the base branch
      # points at by then, and does nothing once any file of the version has
      # reached PyPI. If the base branch moved while CI ran, the bump branch
      # is dropped and the job fails; the next scheduled run on main starts
      # over, and a dispatch has to be repeated by hand.
      - name: Fast-forward the base branch to the tested commit
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          if git merge-base --is-ancestor "$SHA" HEAD 2>/dev/null; then
            echo "::notice::$BASE already contains $SHA"
            # A retry recreated the bump branch at the same commit; clean it
            # up, but leave a branch that points elsewhere for a human.
            if git fetch origin "$BRANCH" 2>/dev/null && [ "$(git rev-parse FETCH_HEAD)" = "$SHA" ]; then
              git push origin --delete "$BRANCH"
            fi
            exit 0
          fi
          if ! git fetch origin "$BRANCH"; then
            echo "::error::$BRANCH is gone but $BASE does not contain $SHA; investigate by hand"
            exit 1
          fi
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$tip" != "$SHA" ]; then
            echo "::error::$BRANCH points at $tip, but CI tested $SHA; refusing to publish"
            exit 1
          fi
          if ! git merge --ff-only "$SHA"; then
            echo "::error::$BASE moved while CI ran; dropping $BRANCH so the next run retries from the new base"
            git push origin --delete "$BRANCH"
            exit 1
          fi
          git push origin "$BASE"
          git push origin --delete "$BRANCH"
      - name: Tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            tagged=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || echo unknown)
            if [ "$tagged" != "$SHA" ]; then
              echo "::warning::v$VERSION already points at $tagged; uploading a dist built from $SHA"
            fi
          else
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          fi
      # The release comes before the upload: once PyPI has the version, detect
      # reports "up to date" and nothing would retry a missing release.
      - name: GitHub release
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" \
            --generate-notes \
            --notes "Bundles upstream https://github.com/bats-core/bats-core/releases/tag/$TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # To rehearse on TestPyPI, add `repository-url: https://test.pypi.org/legacy/`
      # here and point PYPI_URL in scripts/check_upstream.py at test.pypi.org.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # Every failed job ends in a deduplicated issue or a PR, with one exception:
  # when the base branch moved while CI ran (or the bump branch vanished) the
  # run only warns, because the next scheduled run on main starts over by
  # itself. Skipped jobs (detect decided not to bump) do not count as failures.
  report-failure:
    needs: [detect, bump, test, publish]
    if: >-
      always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.bump.outputs.version }}
      BRANCH: ${{ needs.bump.outputs.branch }}
      SHA: ${{ needs.bump.outputs.sha }}
      BASE: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DETECT_RESULT: ${{ needs.detect.result }}
      BUMP_RESULT: ${{ needs.bump.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Open a PR for a red bump, or an issue for any other failure
        run: |
          open_issue() {
            if [ "$(gh issue list --state open --search "\"$1\" in:title" --json number --jq length)" = "0" ]; then
              gh issue create --title "$1" --body "$2"
            fi
          }
          if [ "$DETECT_RESULT" = "failure" ]; then
            open_issue "Update bats: detect failed" \
              "The detect job failed (GitHub or PyPI lookup, or a release tag that is not vX.Y.Z): $RUN_URL. On main the schedule retries daily; a dispatch has to be repeated by hand. This issue is deduplicated by title."
          elif [ "$BUMP_RESULT" = "failure" ]; then
            open_issue "Update bats: bump to $TAG failed before CI" \
              "The bump job failed (tag signature refused, download, or branch push): $RUN_URL. On main the schedule retries daily; a dispatch has to be repeated by hand. This issue is deduplicated by title."
          elif [ "$TEST_RESULT" = "failure" ]; then
            if [ "$(gh pr list --state open --head "$BRANCH" --json number --jq length)" != "0" ]; then
              echo "::notice::a PR for $BRANCH is already open"
            elif ! gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Bump bats to $TAG (smoke tests failing)" \
              --body "Automated bump failed CI: $RUN_URL"; then
              open_issue "Bump bats to $TAG failed CI and no PR could be opened" \
                "CI failed on $BRANCH and \`gh pr create\` failed too, usually because the branch has no commits (initial publish or retry) or Actions may not create PRs: $RUN_URL. Scheduled runs skip this version while the branch exists; inspect it, then delete it to let the next run retry."
            fi
          elif git merge-base --is-ancestor "$SHA" "origin/$BASE"; then
            open_issue "Release v$VERSION failed after merging to $BASE" \
              "The publish job failed after $BASE was updated: $RUN_URL. Use \"Re-run failed jobs\" on that run: the fast-forward is a no-op now and the remaining steps tolerate partial completion, so it uploads the artifact CI tested. A fresh dispatch is no substitute: it builds whatever $BASE points at by then, and does nothing once any file of the version has reached PyPI."
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            open_issue "Release v$VERSION needs a human: $BRANCH was not published" \
              "The publish job refused $BRANCH: $RUN_URL. The branch no longer matches the commit CI tested, or $BASE could not be updated. Scheduled runs skip this version while the branch exists; inspect it, then delete it to let the next run retry."
          else
            echo "::warning::$BASE does not contain $SHA and $BRANCH is gone: either $BASE moved while CI ran and the branch was dropped, or someone deleted it. On main the next scheduled run starts over; a dispatch has to be repeated by hand"
          fi
