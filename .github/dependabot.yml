version: 2
# One grouped PR per ecosystem, on different days so automerge never races
# itself. The cooldown plays the same role as COOLDOWN_DAYS does for upstream
# bats, with a longer window: a compromised or broken release gets time to be
# pulled before it is auto-merged here.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
