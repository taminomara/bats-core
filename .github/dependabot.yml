version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Same idea as COOLDOWN_DAYS for upstream bats: a compromised or broken
    # release gets time to be pulled before it is auto-merged here.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same idea as COOLDOWN_DAYS for upstream bats: a compromised or broken
    # release gets time to be pulled before it is auto-merged here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    # Same idea as COOLDOWN_DAYS for upstream bats: a compromised or broken
    # release gets time to be pulled before it is auto-merged here.
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
