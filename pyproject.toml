[project]
name = "bats-core"
version = "1.14.0"
description = "Bash Automated Testing System (bats-core), packaged for pip"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Unix Shell",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/taminomara/bats-core"
Upstream = "https://github.com/bats-core/bats-core"

[project.scripts]
bats = "bats_core.__main__:main"

# Upstream release bundled into the wheel; rewritten by scripts/bump.py.
[tool.bats-core]
tag = "v1.14.0"
sha256 = "bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177"

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "poethepoet==0.49.0",
    "prek==0.5.7",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "tomli==2.5.0; python_version < '3.11'",
    "tox==4.65.0",
    "tox-uv==1.36.1",
    "ty==0.0.90",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# _bats/ is gitignored; hatchling skips VCS-ignored files unless listed here.
artifacts = ["src/bats_core/_bats/"]

[tool.hatch.build.targets.wheel]
packages = ["src/bats_core"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
src = ["src", "scripts", "."]

[tool.ruff.lint]
extend-select = ["I", "INP", "T20", "PT", "RET", "SIM", "SLOT", "RUF022"]
ignore = [
    "E402",   # Module level import not at top of file
    "E722",   # Do not use bare `except`
    "E741",   # Ambiguous variable name
    "E731",   # Do not assign a `lambda` expression, use a `def`
    "PT015",  # Assertion is always `False`
    "PT011",  # Too broad error type
    "PT012",  # `pytest.raises()` block should contain a single simple statement
    "PT017",  # Found assertion on exception `e` in `except` block
    "RET505", # Unnecessary `else` after `return` statement
    "RET506", # Unnecessary `else` after `raise` statement
    "RET507", # Unnecessary `else` after `continue` statement
    "RET508", # Unnecessary `else` after `break` statement
    "SIM103", # Return the negated condition directly
    "SIM105", # Use `contextlib.suppress` instead of `try`-`except`-`pass`
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "SIM114", # Combine `if` branches using logical `or` operator
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
    "INP001", # Allow implicit packages.
]
extend-safe-fixes = [
    "RUF022", # Sort `__all__`.
    "PT006",  # Rewrite arguments for `pytest.mark.parametrize`.
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ty.src]
include = ["src", "tests", "scripts", "hatch_build.py"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["scripts", "."]
